// ============ УТИЛИТЫ ============
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function getAvatarHtml(name, avatar) {
  if (avatar) return `<img src="${avatar}" alt="${name}">`;
  return name[0].toUpperCase();
}

// ============ ПОДЕЛИТЬСЯ ============
function shareApp() {
  const url = 'https://osovikivan0-hue.github.io/-/';
  const text = `Заходи в Виноград — свой мессенджер для нашего класса! Версия 1.1 🍇\n${url}`;

  if (navigator.share) {
    navigator.share({
      title: 'Виноград v1.1',
      text: text,
      url: url
    }).catch(() => {});
    return;
  }

  copyToClipboard(text);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Ссылка скопирована! 🍇');
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('Ссылка скопирована! 🍇');
  } catch (e) {
    alert('Не удалось скопировать. Вот текст:\n\n' + text);
  }
  document.body.removeChild(textarea);
}

// ============ УВЕДОМЛЕНИЯ ============
async function enableNotifications() {
  if (!('Notification' in window)) {
    alert('Твой браузер не поддерживает уведомления');
    return;
  }

  if (Notification.permission === 'granted') {
    notificationsEnabled = true;
    updateNotificationBtn();
    showToast('Уведомления уже включены ✅');
    subscribeToNotifications();
    return;
  }

  const permission = await Notification.requestPermission();
  if (permission === 'granted') {
    notificationsEnabled = true;
    updateNotificationBtn();
    showToast('Уведомления включены! 🔔');
    subscribeToNotifications();
  } else {
    showToast('Уведомления не разрешены');
  }
}

function updateNotificationBtn() {
  const btn = document.getElementById('notif-btn');
  if (!btn) return;
  if (Notification.permission === 'granted') {
    btn.textContent = '🔔 Уведомления включены';
    btn.style.background = '#2d5c2d';
  }
}

function showNotification(sender, text) {
  if (Notification.permission !== 'granted') return;
  if (!notificationsEnabled) return;

  // Если окно активно — не показываем
  if (document.visibilityState === 'visible' && !document.hidden) {
    // Если открыт не тот чат — показываем
    if (currentChatUser === sender) return;
  }

  try {
    const n = new Notification('Виноград 🍇', {
      body: `${sender}: ${text}`,
      icon: '167241.png',
      badge: '167241.png',
      tag: 'vg-' + sender + '-' + Date.now(),
      vibrate: [200, 100, 200]
    });
    n.onclick = () => {
      window.focus();
      n.close();
    };
  } catch (e) {
    console.error('Ошибка уведомления:', e);
  }
}

function subscribeToNotifications() {
  if (notificationsChannel || !window.supabase) return;
  const sb = window.supabase;

  notificationsChannel = sb.channel('notifications-all')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages' },
      payload => {
        const msg = payload.new;
        // Игнорируем свои сообщения
        if (msg.sender === currentUser) return;

        // Личные чаты
        if (msg.chat_id.startsWith('dm_')) {
          // Проверяем, что этот чат — с нами
          if (!msg.chat_id.includes(currentUser)) return;
          // Если чат открыт и это он — не показываем
          if (currentChat === msg.chat_id) return;
          // Иначе — показываем
          const preview = getMessagePreview(msg);
          showNotification(msg.sender, preview);
        }

        // Группы
        if (msg.chat_id.startsWith('group_')) {
          const groupId = parseInt(msg.chat_id.replace('group_', ''));
          const myGroup = myGroups.find(g => g.id === groupId);
          if (!myGroup) return;
          if (currentChat === msg.chat_id) return;
          const preview = getMessagePreview(msg);
          showNotification(`${myGroup.name}: ${msg.sender}`, preview);
        }
      })
    .subscribe(status => console.log('🔔 Notif channel:', status));
}

function getMessagePreview(msg) {
  if (msg.type === 'sticker') return msg.content;
  if (msg.type === 'sticker-image') return '🍇 Стикер';
  if (msg.type === 'photo') return '📷 Фото';
  return msg.content.length > 50 ? msg.content.slice(0, 50) + '…' : msg.content;
}

function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('auth-btn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-switch').textContent = mode === 'login'
    ? 'Нет аккаунта? Зарегистрироваться'
    : 'Уже есть аккаунт? Войти';
  const avatarPicker = document.querySelector('.avatar-picker');
  if (mode === 'login') {
    avatarPicker.style.display = 'none';
  } else {
    avatarPicker.style.display = 'flex';
  }
}

async function authAction() {
  const btn = document.getElementById('auth-btn');
  const name = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  if (!name || !pass) return alert('Заполни имя и пароль');
  if (!window.supabase) return alert('Supabase не подключён.');

  const sb = window.supabase;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Загрузка...';

  try {
    if (mode === 'register') {
      const { data: existing, error: checkErr } = await sb
        .from('users').select('username').eq('username', name);
      if (checkErr) throw new Error('Ошибка проверки: ' + checkErr.message);
      if (existing && existing.length > 0) {
        btn.disabled = false; btn.textContent = originalText;
        return alert('Такое имя уже занято. Придумай другое.');
      }
      const { error } = await sb.from('users').insert({
        username: name, password: pass, avatar: selectedAvatar
      });
      if (error) throw new Error('Ошибка регистрации: ' + error.message);
      alert(`Аккаунт "${name}" создан! Теперь войди.`);
      toggleMode();
      document.getElementById('password').value = '';
    } else {
      const { data, error } = await sb.from('users').select('*').eq('username', name);
      if (error) throw new Error('Ошибка входа: ' + error.message);
      if (!data || data.length === 0) {
        btn.disabled = false; btn.textContent = originalText;
        return alert('Пользователь не найден');
      }
      if (data[0].password !== pass) {
        btn.disabled = false; btn.textContent = originalText;
        return alert('Неверный пароль');
      }
      login(name);
      return;
    }
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
  btn.disabled = false;
  btn.textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
}

function login(name) {
  currentUser = name;
  localStorage.setItem('vg_current', name);
  document.getElementById('auth').style.display = 'none';
  document.getElementById('messenger').style.display = 'block';
  document.getElementById('messenger').style.height = '100vh';
  document.getElementById('messenger').style.height = '100dvh';
  buildEmojiPanel();
  loadUsers();
  loadMyGroups();
  subscribeGroupsChanges();

  // Подписываемся на уведомления если уже разрешены
  if ('Notification' in window && Notification.permission === 'granted') {
    notificationsEnabled = true;
    subscribeToNotifications();
  }
}

function logout() {
  if (!confirm('Выйти из Винограда?')) return;
  localStorage.removeItem('vg_current');
  location.reload();
}

// ============ ПОЛЬЗОВАТЕЛИ ============
async function loadUsers() {
  const sb = window.supabase;
  try {
    const { data, error } = await sb.from('users').select('username, avatar').order('username');
    if (error) throw error;
    allUsers = (data || []).filter(u => u.username !== currentUser);
    renderUserList();
  } catch (e) {
    console.error('Ошибка загрузки пользователей:', e);
  }
  if (!usersChannel) {
    usersChannel = sb.channel('users-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => {
        loadUsers();
      })
      .subscribe();
  }
}

function filterUsers() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  renderUserList(q);
}

function renderUserList(query = '') {
  const el = document.getElementById('user-list');
  const filtered = query
    ? allUsers.filter(u => u.username.toLowerCase().includes(query))
    : allUsers;
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">🔍</div>${query ? 'Никого не нашли' : 'Пока никого нет'}</div>`;
    return;
  }
  el.innerHTML = filtered.map(u => {
    const name = u.username;
    const safeName = name.replace(/'/g, "\\'");
    return `
      <div class="chat-item" onclick="openChat('${safeName}')">
        <div class="chat-avatar">${getAvatarHtml(name, u.avatar)}</div>
        <div class="chat-info">
          <div class="chat-name">${name}</div>
          <div class="chat-last">нажми, чтобы написать</div>
        </div>
      </div>
    `;
  }).join('');
}

// ============ ГРУППЫ ============
async function loadMyGroups() {
  const sb = window.supabase;
  try {
    const { data: memberships } = await sb
      .from('group_members').select('group_id').eq('username', currentUser);

    const groupIds = (memberships || []).map(m => m.group_id);
    if (groupIds.length === 0) {
      myGroups = [];
      renderGroupList();
      return;
    }

    const { data: groupsData } = await sb
      .from('groups').select('*').in('id', groupIds).order('created_at', { ascending: false });

    myGroups = groupsData || [];
    renderGroupList();
  } catch (e) {
    console.error('Ошибка загрузки групп:', e);
  }
}

function renderGroupList() {
  const el = document.getElementById('group-list');
  if (!myGroups.length) {
    el.innerHTML = `<div class="empty" style="margin-top:10px; padding:10px; font-size:13px;">Нет групп. Создай первую! 👆</div>`;
    return;
  }
  el.innerHTML = myGroups.map(g => `
    <div class="chat-item" onclick="openGroupChat(${g.id}, '${g.name.replace(/'/g, "\\'")}')">
      <div class="chat-avatar group">👥</div>
      <div class="chat-info">
        <div class="chat-name">${g.name}</div>
        <div class="chat-last">группа</div>
      </div>
    </div>
  `).join('');
}

function subscribeGroupsChanges() {
  const sb = window.supabase;
  if (groupsChannel) return;
  groupsChannel = sb.channel('groups-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'groups' }, () => loadMyGroups())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'group_members' }, () => loadMyGroups())
    .subscribe();
}

function openCreateGroup() {

  document.getElementById('group-name').value = '';
  renderCreateUserList();
  document.getElementById('screen-create-group').classList.add('active');
}

function closeCreateGroup() {
  document.getElementById('screen-create-group').classList.remove('active');
}

function renderCreateUserList() {
  const el = document.getElementById('create-user-list');
  if (!allUsers.length) {
    el.innerHTML = `<div class="empty">Некого добавить</div>`;
    return;
  }
  el.innerHTML = allUsers.map(u => {
    const name = u.username;
    const selected = selectedMembers.includes(name);
    const safeName = name.replace(/'/g, "\\'");
    return `
      <div class="user-check-item ${selected ? 'selected' : ''}" onclick="toggleMember('${safeName}')">
        <div class="check-avatar">${getAvatarHtml(name, u.avatar)}</div>

function toggleMember(name) {
  if (selectedMembers.includes(name)) {
    selectedMembers = selectedMembers.filter(n => n !== name);
  } else {
    selectedMembers.push(name);
  }
  renderCreateUserList();
}

async function createGroup() {
  const nameInput = document.getElementById('group-name');
  const groupName = nameInput.value.trim();
  if (!groupName) return alert('Введи название группы');

  const btn = document.getElementById('create-group-btn');
  btn.disabled = true;
  btn.textContent = 'Создаём...';

  const sb = window.supabase;
  try {
    const { data: groupData, error: groupErr } = await sb
      .from('groups').insert({ name: groupName, creator: currentUser }).select();
    if (groupErr) throw groupErr;
    const groupId = groupData[0].id;

    const membersToAdd = [currentUser, ...selectedMembers];
    const membersRows = membersToAdd.map(u => ({ group_id: groupId, username: u }));
    const { error: memErr } = await sb.from('group_members').insert(membersRows);
    if (memErr) throw memErr;

    showToast(`Группа "${groupName}" создана! 🍇`);
    closeCreateGroup();
    loadMyGroups();
  } catch (e) {
    console.error(e);
    alert('Ошибка: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Создать группу';
}

  document.getElementById('screen-chat').classList.add('active');

  subscribeToMessages();
}

function openGroupChat(groupId, groupName) {

  currentChatUser = null;

  document.getElementById('chat-title').textContent = groupName;

  subscribeToMessages();

function closeChat() {

  document.getElementById('emoji-panel').classList.remove('open');
  if (realtimeChannel && window.supabase) {
    window.supabase.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  currentChat = null;
  currentChatUser = null;
  currentGroup = null;

// ============ СООБЩЕНИЯ ============
async function loadMessages() {
  const sb = window.supabase;
  try {
    const { data, error } = await sb
      .from('messages').select('*')
      .eq('chat_id', currentChat)
      .order('created_at', { ascending: true });
    if (error) throw error;
    messages[currentChat] = data || [];
    renderMessages();
  } catch (e) {
    console.error('Ошибка загрузки сообщений:', e);
  }
}

function subscribeToMessages() {
  const sb = window.supabase;
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('chat-' + currentChat)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages' },
      payload => {
        const msg = payload.new;
        if (msg.chat_id !== currentChat) return;
        if (!messages[currentChat]) messages[currentChat] = [];
        if (!messages[currentChat].some(m => m.id === msg.id)) {
          messages[currentChat].push(msg);
          renderMessages();
        }
      })
    .subscribe();
}

function renderMessages() {
  const el = document.getElementById('messages');
  const msgs = messages[currentChat] || [];
  if (!msgs.length) {
    el.innerHTML = '<div class="empty"><div class="big">💬</div>Пока пусто.<br>Напиши первым!</div>';
    return;
  }
  el.innerHTML = msgs.map(m => {
    const isMe = m.sender === currentUser;
    let content = '';
    if (m.type === 'sticker') content = `<div class="sticker">${escapeHtml(m.content)}</div>`;
    else if (m.type === 'sticker-image') content = `<img src="${m.content}" class="sticker-img" alt="sticker">`;
    else if (m.type === 'photo') content = `<img src="${m.content}" alt="photo">`;
    else content = escapeHtml(m.content);

    const time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    const senderHtml = (!isMe && chatType === 'group') ? `<span class="sender">${escapeHtml(m.sender)}</span>` : '';

    return `<div class="msg ${isMe ? 'me' : 'other'}">${senderHtml}${content}<span class="time">${time}</span></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentChat) return;
  input.value = '';
  await addMessage(text, 'text');
}

async function sendSticker(emoji) {
  if (!currentChat) return;
  await addMessage(emoji, 'sticker');
  document.getElementById('emoji-panel').classList.remove('open');
}

async function sendStickerImg(index) {
  if (!currentChat) return;
  const sticker = STICKERS[index];
  await addMessage(sticker.src, 'sticker-image');
  document.getElementById('emoji-panel').classList.remove('open');
}

function sendPhoto(event) {
  const file = event.target.files[0];
  if (!file || !currentChat) return;
  if (file.size > 500000) return alert('Фото больше 500 КБ.');
  const reader = new FileReader();
  reader.onload = async e => await addMessage(e.target.result, 'photo');
  reader.readAsDataURL(file);
  event.target.value = '';
}

async function addMessage(content, type) {
  const sb = window.supabase;
  const { error } = await sb.from('messages').insert({
    chat_id: currentChat,
    sender: currentUser,
    content: content,
    type: type
  });
  if (error) {
    console.error('Ошибка отправки:', error);
    showToast('Ошибка: ' + error.message);
  }
}

// ============ СВАЙП НАЗАД ============
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (touchStartX < 50 && dx > 80 && Math.abs(dy) < 60) {
    if (document.getElementById('screen-group-info').classList.contains('active')) {
      closeGroupInfo();
    } else if (document.getElementById('screen-create-group').classList.contains('active')) {
      closeCreateGroup();
    } else if (document.getElementById('screen-settings').classList.contains('active')) {
      closeSettings();
    } else if (document.getElementById('screen-chat').classList.contains('active')) {
      closeChat();
    }
  }
}, { passive: true });

// ============ СТАРТ ============
window.addEventListener('supabase-ready', () => {
  const saved = localStorage.getItem('vg_current');
  if (saved) login(saved);
});

window.addEventListener('supabase-error', (e) => {
  alert('Ошибка подключения к Supabase: ' + e.detail);
});
</script>
