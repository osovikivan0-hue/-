<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Виноград">
<title>Виноград 🍇</title>
<link rel="icon" type="image/png" href="167241.png">
<link rel="apple-touch-icon" href="167241.png">
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #0f0a1a; color: #fff; height: 100vh; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }

  #auth { background: #1a1226; padding: 25px 25px; width: 100%; max-width: 420px; text-align: center; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
  #auth h1 { color: #b57edc; font-size: 32px; margin-bottom: 6px; }
  #auth p { color: #888; margin-bottom: 18px; font-size: 14px; }

  .avatar-picker { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
  .avatar-picker img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #7d3c98; margin-bottom: 10px; background: #0f0a1a; }
  .avatar-actions { display: flex; gap: 8px; }
  .avatar-actions button { background: #2d1f45; color: #b57edc; border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: 0.15s; }
  .avatar-actions button:active { background: #3d2a5c; transform: scale(0.96); }

  #auth input { width: 100%; padding: 14px; margin-bottom: 10px; background: #0f0a1a; border: 1px solid #3d2a5c; border-radius: 14px; color: #fff; font-size: 16px; }
  #auth input:focus { outline: none; border-color: #b57edc; }
  #auth button.main-btn { width: 100%; padding: 15px; background: #7d3c98; border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 5px; }
  #auth button.main-btn:active { background: #9b59b6; transform: scale(0.98); }
  #auth button.main-btn:disabled { background: #555; cursor: wait; }
  #auth .switch { margin-top: 15px; font-size: 14px; color: #888; cursor: pointer; padding: 10px; }
  #auth .switch:active { color: #b57edc; }

  #messenger { display: none; width: 100%; max-width: 600px; position: relative; }

  .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: #0f0a1a; transition: transform 0.3s ease; will-change: transform; }
  .screen-chats { z-index: 1; }
  .screen-chat { z-index: 2; transform: translateX(100%); background: #0f0a1a; }
  .screen-chat.active { transform: translateX(0); }

  .header { padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); background: #1a1226; border-bottom: 1px solid #2d1f45; display: flex; align-items: center; gap: 10px; min-height: 60px; flex-shrink: 0; }
  .header h2 { color: #b57edc; font-size: 22px; flex: 1; display: flex; align-items: center; gap: 10px; }
  .header .icon-btn { background: transparent; border: none; color: #b57edc; font-size: 22px; cursor: pointer; padding: 6px 10px; border-radius: 10px; transition: 0.2s; }
  .header .icon-btn:active { background: #2d1f45; }
  .header .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #7d3c98, #b57edc); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex-shrink: 0; overflow: hidden; }
  .header .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .header .info { flex: 1; min-width: 0; }
  .header .title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header .status { font-size: 12px; color: #6bcf7f; }

  .search-bar { padding: 10px 16px; background: #1a1226; border-bottom: 1px solid #2d1f45; flex-shrink: 0; }
  .search-bar input { width: 100%; padding: 10px 16px; background: #0f0a1a; border: 1px solid #3d2a5c; border-radius: 20px; color: #fff; font-size: 15px; }
  .search-bar input:focus { outline: none; border-color: #b57edc; }

  .chats { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .chat-item { padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid #1f1530; }
  .chat-item:active { background: #251b38; }
  .chat-item .chat-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #7d3c98, #b57edc); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; overflow: hidden; }
  .chat-item .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-item .chat-info { flex: 1; min-width: 0; }
  .chat-item .chat-name { font-weight: 600; font-size: 16px; margin-bottom: 3px; }
  .chat-item .chat-last { color: #777; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .section-title { padding: 12px 16px 6px; font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

  .messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; background: #0f0a1a; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-wrap: break-word; animation: fadeIn 0.2s; position: relative; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.me { align-self: flex-end; background: #7d3c98; border-bottom-right-radius: 5px; }
  .msg.other { align-self: flex-start; background: #251b38; border-bottom-left-radius: 5px; }
  .msg .time { font-size: 10px; opacity: 0.65; margin-top: 3px; display: block; text-align: right; }
  .msg img { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; }
  .msg .sticker { font-size: 56px; line-height: 1; padding: 4px; }
  .msg .sticker-msg { width: 140px; height: 140px; object-fit: contain; display: block; margin-top: 4px; }

  .emoji-panel { display: none; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: #1a1226; border-top: 1px solid #2d1f45; max-height: 45vh; overflow-y: auto; flex-shrink: 0; }
  .emoji-panel.open { display: block; }
  .sticker-row { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #2d1f45; }
  .sticker-btn { width: 70px; height: 70px; object-fit: contain; cursor: pointer; border-radius: 12px; padding: 4px; transition: 0.15s; background: #0f0a1a; border: 1px solid #2d1f45; }
  .sticker-btn:active { transform: scale(0.9); background: #2d1f45; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .emoji-row span { font-size: 30px; cursor: pointer; padding: 6px; border-radius: 10px; transition: 0.15s; user-select: none; }
  .emoji-row span:active { background: #2d1f45; transform: scale(0.9); }

  .input-area { padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: #1a1226; border-top: 1px solid #2d1f45; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .input-area .icon-btn { background: transparent; border: none; color: #b57edc; font-size: 24px; cursor: pointer; padding: 6px; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.15s; }
  .input-area .icon-btn:active { background: #2d1f45; transform: scale(0.9); }
  .input-area input[type="text"] { flex: 1; padding: 12px 16px; background: #0f0a1a; border: 1px solid #3d2a5c; border-radius: 22px; color: #fff; font-size: 16px; min-width: 0; }
  .input-area input[type="text"]:focus { outline: none; border-color: #b57edc; }
  .input-area .send { background: #7d3c98; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; cursor: pointer; flex-shrink: 0; transition: 0.15s; }
  .input-area .send:active { background: #9b59b6; transform: scale(0.92); }

  .empty { color: #555; text-align: center; margin-top: 40px; padding: 20px; font-size: 15px; }
  .empty .big { font-size: 60px; margin-bottom: 12px; opacity: 0.4; }

  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #7d3c98; color: #fff; padding: 12px 22px; border-radius: 25px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth">
  <h1>🍇 Виноград</h1>
  <p id="auth-sub">Добро пожаловать</p>

  <div class="avatar-picker">
    <img id="avatar-preview" src="167241.png" alt="аватар">
    <div class="avatar-actions">
      <button type="button" onclick="document.getElementById('avatar-input').click()">📷 Выбрать</button>
      <button type="button" onclick="useDefaultAvatar()">🍇 Виноград</button>
    </div>
    <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="pickAvatar(event)">
  </div>

  <input type="text" id="username" placeholder="Имя" autocomplete="off">
  <input type="text" id="surname" placeholder="Фамилия (чтобы отличить тёзок)" autocomplete="off">
  <input type="password" id="password" placeholder="Пароль" autocomplete="off">
  <button class="main-btn" onclick="authAction()" id="auth-btn">Войти</button>
  <div class="switch" onclick="toggleMode()" id="auth-switch">Нет аккаунта? Зарегистрироваться</div>
</div>

<!-- МЕССЕНДЖЕР -->
<div id="messenger">

  <div class="screen screen-chats">
    <div class="header">
      <h2>🍇 Виноград</h2>
      <button class="icon-btn" onclick="logout()" title="Выйти">⎋</button>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔍 Поиск людей..." oninput="filterUsers()">
    </div>
    <div class="chats" id="chats">
      <div class="section-title">Люди в Винограде</div>
      <div id="user-list"></div>
    </div>
  </div>

  <div class="screen screen-chat" id="screen-chat">
    <div class="header">
      <button class="icon-btn" onclick="closeChat()">←</button>
      <div class="avatar" id="chat-avatar">?</div>
      <div class="info">
        <div class="title" id="chat-title">Чат</div>
        <div class="status" id="chat-status">личный чат</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>
    <div class="emoji-panel" id="emoji-panel"></div>

    <div class="input-area">
      <button class="icon-btn" onclick="toggleEmoji()">😊</button>
      <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendPhoto(event)">
      <input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="send" onclick="sendMsg()">➤</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ============ СОСТОЯНИЕ ============
let mode = 'login';
let currentUser = null;
let currentChat = null;
let currentChatUser = null;
let allUsers = [];
let messages = {};
let realtimeChannel = null;
let usersChannel = null;
let selectedAvatar = null;

const STICKERS = [
  { type: 'image', src: 'sticker1.png', name: 'ИМБА' }
];

const EMOJIS = ['😊','😂','🥰','😎','🤔','😴','😭','😡','👍','👎','❤️','🔥','✨','🎉','🍇','🍷','🍕','☕','🌙','⭐','💬','🙌','🤝','💪','😉','😇','🤩','🥳','😔','🤯','😅','🙃','😏','🤗','🤫'];

// ============ УТИЛИТЫ ============
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ АВАТАРКИ ============
function pickAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 200000) {
    alert('Аватар больше 200 КБ. Выбери картинку поменьше.');
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    selectedAvatar = e.target.result;
    document.getElementById('avatar-preview').src = selectedAvatar;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function useDefaultAvatar() {
  selectedAvatar = null;
  document.getElementById('avatar-preview').src = '167241.png';
}

function getAvatarHtml(name, avatar) {
  if (avatar) {
    return `<img src="${avatar}" alt="${name}">`;
  }
  return name[0].toUpperCase();
}

// ============ АВТОРИЗАЦИЯ ============
function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('auth-btn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-switch').textContent = mode === 'login'
    ? 'Нет аккаунта? Зарегистрироваться'
    : 'Уже есть аккаунт? Войти';

  const surnameInput = document.getElementById('surname');
  const avatarPicker = document.querySelector('.avatar-picker');
  if (mode === 'login') {
    surnameInput.style.display = 'none';
    avatarPicker.style.display = 'none';
  } else {
    surnameInput.style.display = 'block';
    avatarPicker.style.display = 'flex';
  }
}

async function authAction() {
  const btn = document.getElementById('auth-btn');
  const firstName = document.getElementById('username').value.trim();
  const surname = document.getElementById('surname')?.value.trim() || '';
  const pass = document.getElementById('password').value.trim();

  const name = mode === 'register' && surname ? `${firstName} ${surname}` : firstName;

  if (!firstName || !pass) return alert('Заполни имя и пароль');

  if (!window.supabase) {
    return alert('Supabase не подключён. Проверь URL и ключ.');
  }

  const sb = window.supabase;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Загрузка...';

  try {
    if (mode === 'register') {
      const { data: existing, error: checkErr } = await sb
        .from('users').select('username').eq('username', name);

      if (checkErr) throw new Error('Ошибка проверки: ' + checkErr.message);
      if (existing && existing.length > 0) {
        btn.disabled = false; btn.textContent = originalText;
        return alert('Такое имя уже занято. Попробуй добавить фамилию или другое имя.');
      }

      const { error } = await sb.from('users').insert({
        username: name,
        password: pass,
        avatar: selectedAvatar
      });
      if (error) throw new Error('Ошибка регистрации: ' + error.message);

      alert(`Аккаунт "${name}" создан! Теперь войди.`);
      toggleMode();
      document.getElementById('password').value = '';
    } else {
      const { data, error } = await sb
        .from('users').select('*').eq('username', name);

      if (error) throw new Error('Ошибка входа: ' + error.message);
      if (!data || data.length === 0) {
        btn.disabled = false; btn.textContent = originalText;
        return alert('Пользователь не найден');
      }
      if (data[0].password !== pass) {
        btn.disabled = false; btn.textContent = originalText;
        return alert('Неверный пароль');
      }
      login(name);
      return;
    }
  } catch (e) {
    console.error(e);
    alert(e.message);
  }

  btn.disabled = false;
  btn.textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
}

function login(name) {
  currentUser = name;
  localStorage.setItem('vg_current', name);
  document.getElementById('auth').style.display = 'none';
  document.getElementById('messenger').style.display = 'block';
  document.getElementById('messenger').style.height = '100vh';
  document.getElementById('messenger').style.height = '100dvh';
  buildEmojiPanel();
  loadUsers();
}

function logout() {
  if (!confirm('Выйти из Винограда?')) return;
  localStorage.removeItem('vg_current');
  location.reload();
}

// ============ СПИСОК ПОЛЬЗОВАТЕЛЕЙ ============
async function loadUsers() {
  const sb = window.supabase;
  try {
    const { data, error } = await sb.from('users').select('username, avatar').order('username');
    if (error) throw error;
    allUsers = (data || []).filter(u => u.username !== currentUser);
    renderUserList();
  } catch (e) {
    console.error('Ошибка загрузки пользователей:', e);
  }

  if (!usersChannel) {
    usersChannel = sb.channel('users-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => {
        loadUsers();
      })
      .subscribe();
  }
}

function filterUsers() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  renderUserList(q);
}

function renderUserList(query = '') {
  const el = document.getElementById('user-list');
  const filtered = query
    ? allUsers.filter(u => u.username.toLowerCase().includes(query))
    : allUsers;

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">🔍</div>${query ? 'Никого не нашли' : 'Пока никого нет'}</div>`;
    return;
  }

  el.innerHTML = filtered.map(u => {
    const name = u.username;
    const safeName = name.replace(/'/g, "\\'");
    return `
      <div class="chat-item" onclick="openChat('${safeName}')">
        <div class="chat-avatar">${getAvatarHtml(name, u.avatar)}</div>
        <div class="chat-info">
          <div class="chat-name">${name}</div>
          <div class="chat-last">нажми, чтобы написать</div>
        </div>
      </div>
    `;
  }).join('');
}

// ============ ЧАТЫ ============
function getChatId(user1, user2) {
  return 'dm_' + [user1, user2].sort().join('_');
}

function openChat(otherUser) {
  currentChatUser = otherUser;
  currentChat = getChatId(currentUser, otherUser);

  document.getElementById('chat-title').textContent = otherUser;
  const otherData = allUsers.find(u => u.username === otherUser);
  document.getElementById('chat-avatar').innerHTML = getAvatarHtml(otherUser, otherData?.avatar);
  document.getElementById('chat-status').textContent = 'личный чат';
  document.getElementById('screen-chat').classList.add('active');
  document.getElementById('emoji-panel').classList.remove('open');

  loadMessages();
  subscribeToMessages();
}

function closeChat() {
  document.getElementById('screen-chat').classList.remove('active');
  document.getElementById('emoji-panel').classList.remove('open');
  if (realtimeChannel && window.supabase) {
    window.supabase.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  currentChat = null;
  currentChatUser = null;
}

// ============ СООБЩЕНИЯ ============
async function loadMessages() {
  const sb = window.supabase;
  try {
    const { data, error } = await sb
      .from('messages').select('*')
      .eq('chat_id', currentChat)
      .order('created_at', { ascending: true });
    if (error) throw error;
    messages[currentChat] = data || [];
    renderMessages();
  } catch (e) {
    console.error('Ошибка загрузки сообщений:', e);
  }
}

function subscribeToMessages() {
  const sb = window.supabase;
  if (realtimeChannel) sb.removeChannel(realtimeChannel);

  realtimeChannel = sb.channel('chat-' + currentChat)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${currentChat}` },
      payload => {
        if (!messages[currentChat]) messages[currentChat] = [];
        if (!messages[currentChat].some(m => m.id === payload.new.id)) {
          messages[currentChat].push(payload.new);
          renderMessages();
        }
      })
    .subscribe();
}

function renderMessages() {
  const el = document.getElementById('messages');
  const msgs = messages[currentChat] || [];
  if (!msgs.length) {
    el.innerHTML = '<div class="empty"><div class="big">💬</div>Пока пусто.<br>Напиши первым!</div>';
    return;
  }
  el.innerHTML = msgs.map(m => {
    const isMe = m.sender === currentUser;
    let content = '';
    if (m.type === 'sticker') content = `<div class="sticker">${escapeHtml(m.content)}</div>`;
    else if (m.type === 'sticker-image') content = `<img src="${m.content}" class="sticker-msg" alt="sticker">`;
    else if (m.type === 'photo') content = `<img src="${m.content}" alt="photo">`;
    else content = escapeHtml(m.content);
    const time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    return `<div class="msg ${isMe ? 'me' : 'other'}">${content}<span class="time">${time}</span></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentChat) return;
  input.value = '';
  await addMessage(text, 'text');
}

async function sendSticker(emoji) {
  if (!currentChat) return;
  await addMessage(emoji, 'sticker');
  document.getElementById('emoji-panel').classList.remove('open');
}

async function sendStickerImg(index) {
  if (!currentChat) return;
  const sticker = STICKERS[index];
  await addMessage(sticker.src, 'sticker-image');
  document.getElementById('emoji-panel').classList.remove('open');
}

function sendPhoto(event) {
  const file = event.target.files[0];
  if (!file || !currentChat) return;
  if (file.size > 500000) return alert('Фото больше 500 КБ.');
  const reader = new FileReader();
  reader.onload = async e => await addMessage(e.target.result, 'photo');
  reader.readAsDataURL(file);
  event.target.value = '';
}

async function addMessage(content, type) {
  const sb = window.supabase;
  const { error } = await sb.from('messages').insert({
    chat_id: currentChat,
    sender: currentUser,
    content: content,
    type: type
  });
  if (error) {
    console.error('Ошибка отправки:', error);
    showToast('Ошибка: ' + error.message);
  }
}

// ============ ЭМОДЗИ И СТИКЕРЫ ============
function buildEmojiPanel() {
  const el = document.getElementById('emoji-panel');
  const stickersHtml = STICKERS.map((s, i) =>
    `<img src="${s.src}" class="sticker-btn" onclick="sendStickerImg(${i})" alt="${s.name}">`
  ).join('');
  const emojisHtml = EMOJIS.map(e => `<span onclick="sendSticker('${e}')">${e}</span>`).join('');
  el.innerHTML = `<div class="sticker-row">${stickersHtml}</div><div class="emoji-row">${emojisHtml}</div>`;
}

function toggleEmoji() {
  document.getElementById('emoji-panel').classList.toggle('open');
}

// ============ СВАЙП НАЗАД ============
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (touchStartX < 50 && dx > 80 && Math.abs(dy) < 60) {
    if (document.getElementById('screen-chat').classList.contains('active')) closeChat();
  }
}, { passive: true });

// ============ СТАРТ ============
window.addEventListener('supabase-ready', () => {
  const saved = localStorage.getItem('vg_current');
  if (saved) login(saved);
});

window.addEventListener('supabase-error', (e) => {
  alert('Ошибка подключения к Supabase: ' + e.detail);
});
</script>
